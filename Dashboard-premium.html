<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOKES Employability Skills Curriculum — Premium Prototype</title>
    <link rel="icon" href="SPOKES-Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007baf;
            --accent: #37b550;
            --dark: #004071;
            --light: #FFFFFF;
            --muted: #EDF3F7;
            --gray: #60636b;
            --gold: #d3b257;
            --royal: #00133f;
            --mauve: #a7253f;
            --offwhite: #d1d3d4;
            --muted-gold: #ad8806;
            --font-heading: "DM Serif Display", Georgia, serif;
            --font-body: "Outfit", system-ui, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--royal);
            background: linear-gradient(135deg, var(--light) 0%, var(--muted) 58%, rgba(211, 178, 87, 0.16) 100%);
            overflow-x: hidden;
        }

        a {
            color: inherit;
        }

        button,
        input {
            font: inherit;
        }

        .skip-link {
            position: absolute;
            left: 1rem;
            top: -4rem;
            z-index: 100;
            padding: 0.7rem 1rem;
            border-radius: 0 0 8px 8px;
            background: var(--royal);
            color: var(--light);
            font-weight: 700;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .dashboard-shell {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* One authored mark instead of tiled texture: the SPOKES bridge
           arch with its spokes, oversized and cropped, in quiet royal */
        .backdrop-motif {
            position: fixed;
            right: -10vw;
            bottom: -8vh;
            width: 72vw;
            height: auto;
            color: var(--royal);
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 1rem clamp(1rem, 3vw, 3rem) 1.4rem;
            color: var(--light);
            background:
                linear-gradient(125deg, rgba(0, 19, 63, 0.98), rgba(0, 64, 113, 0.96) 56%, rgba(0, 123, 175, 0.9));
            box-shadow: 0 22px 60px rgba(0, 19, 63, 0.18);
        }

        .hero::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--mauve), var(--gold), var(--accent), var(--primary));
        }

        .topbar,
        footer {
            width: min(1740px, calc(100% - 2rem));
            margin-inline: auto;
        }

        .dashboard-main {
            width: min(1740px, calc(100% - 2rem));
            margin-inline: auto;
        }

        .topbar {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 1rem;
        }

        .brand-lockup {
            display: inline-flex;
            align-items: center;
            gap: 1.25rem;
            min-width: 0;
        }

        .logo-frame {
            width: 132px;
            height: 84px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            padding: 0.7rem 0.85rem;
            border-radius: 8px;
            background: var(--light);
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(0, 19, 63, 0.22);
        }

        .spokes-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transform: translateY(-1px);
        }

        .hero-title {
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-family: var(--font-heading);
            font-size: clamp(1.9rem, 2.6vw, 2.7rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 0;
            color: var(--light);
        }

        .hero-note {
            margin: 0.35rem 0 0;
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(0.95rem, 1.2vw, 1.05rem);
        }

        .dashboard-main {
            position: relative;
            z-index: 2;
            flex: 1;
            margin-top: 1.4rem;
            padding-bottom: 3rem;
        }

        .noscript-list {
            margin: 0 0 1rem;
            padding: 1rem 1.25rem;
            border: 1px solid rgba(0, 64, 113, 0.18);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
        }

        .noscript-list p {
            margin: 0 0 0.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .noscript-list ul {
            margin: 0;
            padding-left: 1.2rem;
        }

        .noscript-list li {
            margin: 0.25rem 0;
        }

        .noscript-list a {
            color: var(--primary);
            font-weight: 700;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.85rem;
        }

        .module-card {
            --card-accent: var(--primary);
            --card-soft: rgba(0, 123, 175, 0.1);
            position: relative;
            display: flex;
            min-height: 370px;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(0, 64, 113, 0.14);
            border-radius: 8px;
            color: var(--light);
            text-decoration: none;
            background: var(--royal);
            box-shadow: 0 18px 42px rgba(0, 64, 113, 0.1);
            animation: cardReveal 0.45s ease both;
            animation-delay: calc(var(--i, 0) * 65ms);
            transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
        }

        .module-card::before {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 7px;
            background: var(--card-accent);
            z-index: 3;
        }

        .module-card::after {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 210px;
            background:
                linear-gradient(180deg, rgba(0, 19, 63, 0.04) 0%, rgba(0, 19, 63, 0.2) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .module-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 64, 113, 0.28);
            box-shadow: 0 28px 70px rgba(0, 64, 113, 0.16);
        }

        .module-card:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 4px;
        }

        .module-card--planned {
            cursor: default;
        }

        .module-card--planned:hover {
            transform: none;
        }

        /* Duotone artwork system: every image is neutralized to grayscale,
           then washed with its own lesson's accent — six mismatched styles
           read as one commissioned set. Hover lifts the wash to full color. */
        .card-art {
            position: relative;
            min-height: 154px;
            flex: 0 0 154px;
            overflow: hidden;
            background: var(--card-soft);
            isolation: isolate;
        }

        .card-art img {
            width: 100%;
            height: 100%;
            min-height: 154px;
            display: block;
            object-fit: cover;
            object-position: var(--image-position, center);
            filter: grayscale(1) contrast(1.06) brightness(0.94);
            transform: scale(1.01);
            transition: transform 0.45s ease, filter 0.45s ease;
        }

        .card-art::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: var(--royal);
            mix-blend-mode: multiply;
            opacity: 0.28;
            transition: opacity 0.45s ease;
            pointer-events: none;
        }

        .card-art::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: var(--card-accent);
            mix-blend-mode: color;
            opacity: 0.9;
            transition: opacity 0.45s ease;
            pointer-events: none;
        }

        .module-card:hover .card-art img {
            filter: grayscale(0) contrast(1.03);
            transform: scale(1.055);
        }

        .module-card:hover .card-art::before {
            opacity: 0.08;
        }

        .module-card:hover .card-art::after {
            opacity: 0.16;
        }

        .card-body {
            position: relative;
            z-index: 2;
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 1rem 1rem 0.9rem;
            background:
                linear-gradient(180deg, rgba(0, 19, 63, 0.98), rgba(0, 19, 63, 1));
        }

        /* Quiet index numeral — a visual shelf order for the six lessons */
        .card-num {
            position: absolute;
            top: 0.35rem;
            right: 0.75rem;
            font-family: var(--font-heading);
            font-size: 4.2rem;
            line-height: 1;
            color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            user-select: none;
        }

        .module-name {
            margin: 0;
            color: var(--light);
            font-family: var(--font-heading);
            font-size: clamp(1.26rem, 1.45vw, 1.58rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 0;
            overflow-wrap: anywhere;
            text-wrap: balance;
        }

        .theme-communication .module-name {
            font-size: clamp(1.14rem, 1.3vw, 1.42rem);
            line-height: 1.02;
        }

        .module-desc {
            margin: 0.65rem 0 0;
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.9rem;
            line-height: 1.44;
        }

        .card-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.7rem 0 0;
            padding: 0;
            list-style: none;
        }

        .card-chips li {
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            padding: 0.22rem 0.55rem;
            color: rgba(255, 255, 255, 0.92);
            background: rgba(255, 255, 255, 0.08);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .card-footer {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 1rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
        }

        .launch-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            min-height: 44px;
            border-radius: 999px;
            padding: 0.55rem 0.9rem;
            color: var(--button-text, var(--light));
            background: var(--button-accent, var(--card-accent));
            font-size: 0.82rem;
            font-weight: 800;
            transition: transform 0.24s ease, box-shadow 0.24s ease;
        }

        .module-card:hover .launch-cta {
            transform: translateX(2px);
            box-shadow: 0 12px 24px rgba(0, 64, 113, 0.18);
        }

        .arrow-icon {
            line-height: 1;
            transition: transform 0.24s ease;
        }

        .module-card:hover .arrow-icon {
            transform: translateX(4px);
        }

        .planned-label {
            color: var(--gray);
            font-size: 0.92rem;
            font-weight: 800;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 2rem;
            border: 1px dashed rgba(0, 64, 113, 0.24);
            border-radius: 8px;
            color: var(--gray);
            background: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-weight: 700;
        }

        footer {
            padding: 0 0 2rem;
            color: var(--gray);
            font-size: 0.9rem;
        }

        footer p {
            margin: 0;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(0, 64, 113, 0.16);
        }

        .offline-note {
            display: block;
            margin-top: 0.4rem;
            font-weight: 700;
            color: var(--dark);
        }

        .offline-note[hidden] {
            display: none;
        }

        .theme-time {
            --card-accent: var(--primary);
            --button-accent: var(--primary);
            --card-soft: rgba(0, 123, 175, 0.1);
        }

        .theme-interview {
            --card-accent: var(--mauve);
            --button-accent: var(--mauve);
            --card-soft: rgba(0, 19, 63, 0.1);
        }

        .theme-accountability {
            --card-accent: var(--accent);
            --button-accent: var(--accent);
            --button-text: var(--royal);
            --card-soft: rgba(55, 181, 80, 0.14);
        }

        .theme-communication {
            --card-accent: var(--primary);
            --button-accent: var(--dark);
            --card-soft: rgba(0, 123, 175, 0.1);
        }

        .theme-anger {
            --card-accent: var(--mauve);
            --button-accent: var(--muted-gold);
            --button-text: var(--royal);
            --card-soft: rgba(167, 37, 63, 0.1);
        }

        .theme-problemSolving {
            --card-accent: var(--muted-gold);
            --button-accent: var(--gold);
            --button-text: var(--royal);
            --card-soft: rgba(211, 178, 87, 0.18);
        }

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 1500px) {
            .dashboard-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 1050px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .hero {
                padding: 0.85rem 1rem 1.1rem;
            }

            .brand-lockup {
                gap: 0.85rem;
            }

            .logo-frame {
                width: 96px;
                height: 62px;
                padding: 0.45rem 0.55rem;
            }

            h1 {
                font-size: clamp(1.35rem, 6.4vw, 1.8rem);
            }

            .dashboard-main {
                width: min(100% - 1rem, 1180px);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .module-card {
                min-height: 0;
            }
        }
    </style>
</head>
<body>
    <a href="#dashboardGrid" class="skip-link">Skip to lessons</a>

    <svg class="backdrop-motif" viewBox="0 0 1200 620" aria-hidden="true" focusable="false">
        <path d="M0 600 Q 600 -80 1200 600" fill="none" stroke="currentColor" stroke-width="4"></path>
        <line x1="240" y1="600" x2="240" y2="382" stroke="currentColor" stroke-width="2.5"></line>
        <line x1="360" y1="600" x2="360" y2="314" stroke="currentColor" stroke-width="2.5"></line>
        <line x1="480" y1="600" x2="480" y2="274" stroke="currentColor" stroke-width="2.5"></line>
        <line x1="600" y1="600" x2="600" y2="260" stroke="currentColor" stroke-width="2.5"></line>
        <line x1="720" y1="600" x2="720" y2="274" stroke="currentColor" stroke-width="2.5"></line>
        <line x1="840" y1="600" x2="840" y2="314" stroke="currentColor" stroke-width="2.5"></line>
        <line x1="960" y1="600" x2="960" y2="382" stroke="currentColor" stroke-width="2.5"></line>
        <line x1="0" y1="600" x2="1200" y2="600" stroke="currentColor" stroke-width="4"></line>
    </svg>

    <div class="dashboard-shell">
        <header class="hero">
            <div class="topbar">
                <div class="brand-lockup">
                    <div class="logo-frame">
                        <img src="SPOKES-Logo.png" alt="SPOKES logo" class="spokes-logo">
                    </div>
                    <div class="hero-title">
                        <h1>Employability Skills Curriculum</h1>
                        <p class="hero-note">Interactive lessons for the classroom &mdash; choose one to launch.</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="dashboard-main">
            <noscript>
                <div class="noscript-list">
                    <p>Lessons (JavaScript is off, so here are direct links):</p>
                    <ul>
                        <li><a href="lesson-time-management/index.html">Time Management</a></li>
                        <li><a href="lesson-interview-skills/index.html">Interview Skills</a></li>
                        <li><a href="lesson-employee-accountability/index.html">Employee Accountability</a></li>
                        <li><a href="lesson-communicating-with-the-public/index.html">Communicating with the Public</a></li>
                        <li><a href="lesson-controlling-anger/index.html">Controlling Anger</a></li>
                        <li><a href="lesson-problem-solving-and-decision-making/index.html">Problem Solving &amp; Decision Making</a></li>
                    </ul>
                </div>
            </noscript>

            <div class="dashboard-grid" id="dashboardGrid"></div>
        </main>

        <footer>
            <p>&copy; 2026 WV Adult Basic Education. All rights reserved.
                <span class="offline-note" id="offlineNote" hidden>Showing the built-in lesson list (offline copy, last synced 2026-08-04).</span>
            </p>
        </footer>
    </div>

    <script>
        // Keep FALLBACK_LESSONS (and this sync date) in sync with
        // lesson-registry.json — this list is what file:// and offline users see.
        const FALLBACK_SYNCED = '2026-08-04';

        const FALLBACK_LESSONS = [
            {
                id: 'lesson-time-management',
                title: 'Time Management',
                description: 'Master prioritization, scheduling, and daily planning strategies for workplace success.',
                themeKey: 'time',
                path: 'lesson-time-management/index.html',
                status: 'ready',
                slides: 37,
                videos: 5,
                interactions: { implemented: 3 }
            },
            {
                id: 'lesson-interview-skills',
                title: 'Interview Skills',
                description: 'Build confidence and master techniques for successful job interviews.',
                themeKey: 'interview',
                path: 'lesson-interview-skills/index.html',
                status: 'ready',
                slides: 36,
                videos: 2,
                interactions: { implemented: 5 }
            },
            {
                id: 'lesson-employee-accountability',
                title: 'Employee Accountability',
                description: 'Develop personal responsibility, goal-setting, and professional growth habits.',
                themeKey: 'accountability',
                path: 'lesson-employee-accountability/index.html',
                status: 'ready',
                slides: 35,
                videos: 0,
                interactions: { implemented: 3 }
            },
            {
                id: 'lesson-communicating-with-the-public',
                title: 'Communicating with the Public',
                description: 'Master active listening, communication styles, congruent messaging, and self-advocacy skills for workplace and personal success.',
                themeKey: 'communication',
                path: 'lesson-communicating-with-the-public/index.html',
                status: 'qa',
                slides: 33,
                videos: 8,
                interactions: { implemented: 8 }
            },
            {
                id: 'lesson-controlling-anger',
                title: 'Controlling Anger',
                description: 'Recognize anger triggers, practice healthy expression through the Embrace-Express-Work Through framework, and build coping strategies for the workplace.',
                themeKey: 'anger',
                path: 'lesson-controlling-anger/index.html',
                status: 'qa',
                slides: 33,
                videos: 4,
                interactions: { implemented: 6 }
            },
            {
                id: 'lesson-problem-solving-and-decision-making',
                title: 'Problem Solving & Decision Making',
                description: 'Apply structured problem-solving frameworks, critical thinking strategies, and group decision-making techniques for workplace success.',
                themeKey: 'problemSolving',
                path: 'lesson-problem-solving-and-decision-making/index.html',
                status: 'qa',
                slides: 28,
                videos: 4,
                interactions: { implemented: 6 }
            }
        ];

        const LESSON_IMAGE_MAP = {
            'lesson-time-management': {
                src: 'lesson-time-management/images/toolbox.webp',
                alt: 'Colorful time management toolbox with planner, clock, and schedule tools',
                position: 'center'
            },
            'lesson-interview-skills': {
                src: 'lesson-interview-skills/images/handshake.webp',
                alt: 'Professional handshake representing interview readiness',
                position: 'center'
            },
            'lesson-employee-accountability': {
                src: 'lesson-employee-accountability/images/section-circles/intro-accountability.webp',
                alt: 'Workplace accountability illustration',
                position: 'center'
            },
            'lesson-communicating-with-the-public': {
                src: 'lesson-communicating-with-the-public/images/ppt-inspiration/image1.png',
                alt: 'Communication lesson visual from the presentation artwork',
                position: 'center'
            },
            'lesson-controlling-anger': {
                src: 'lesson-controlling-anger/images/anger-visuals/trigger-pressure.svg',
                alt: 'Pressure and trigger illustration for controlling anger',
                position: 'center'
            },
            'lesson-problem-solving-and-decision-making': {
                src: 'lesson-problem-solving-and-decision-making/images/ppt-inspired/you-decide.jpg',
                alt: 'Decision-making figure with arrows pointing in multiple directions',
                position: 'center'
            }
        };

        let allLessons = [];

        function normalizeStatus(status) {
            return String(status || 'planned').trim().toLowerCase();
        }

        function isLaunchable(status) {
            const statusKey = normalizeStatus(status);
            return statusKey === 'complete' || statusKey === 'ready' || statusKey === 'qa';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function (char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[char];
            });
        }

        function sanitizeLessonPath(path) {
            const rawPath = String(path ?? '').trim();
            if (!rawPath) return '';
            if (!/^[A-Za-z0-9_./' -]+$/.test(rawPath)) return '';
            if (rawPath.startsWith('/') || rawPath.includes('..')) return '';
            if (!rawPath.toLowerCase().endsWith('.html')) return '';
            return encodeURI(rawPath);
        }

        function getThemeClass(themeKey, index) {
            const known = ['time', 'interview', 'accountability', 'communication', 'anger', 'problemSolving'];
            if (known.includes(themeKey)) return `theme-${themeKey}`;
            return ['theme-time', 'theme-problemSolving', 'theme-interview', 'theme-anger', 'theme-accountability'][index % 5];
        }

        function getLessonImage(lesson) {
            return LESSON_IMAGE_MAP[lesson.id] || {
                src: 'SPOKES-Logo.png',
                alt: 'SPOKES lesson artwork',
                position: 'center'
            };
        }

        function buildChips(lesson) {
            const chips = [];
            const slides = Number(lesson.slides);
            const videos = Number(lesson.videos);
            const activities = Number(lesson.interactions && lesson.interactions.implemented);
            if (Number.isFinite(slides) && slides > 0) chips.push(slides + ' slides');
            if (Number.isFinite(videos) && videos > 0) chips.push(videos + (videos === 1 ? ' video' : ' videos'));
            if (Number.isFinite(activities) && activities > 0) chips.push(activities + (activities === 1 ? ' activity' : ' activities'));
            if (!chips.length) return '';
            return `<ul class="card-chips">${chips.map(chip => `<li>${escapeHtml(chip)}</li>`).join('')}</ul>`;
        }

        function buildCard(lesson, index) {
            const launchable = isLaunchable(lesson.status);
            const safePath = launchable ? sanitizeLessonPath(lesson.path) : '';
            const isLaunchableLesson = launchable && !!safePath;
            const tag = isLaunchableLesson ? 'a' : 'div';
            const titleId = 'lesson-title-' + index;
            const hrefAttr = tag === 'a' ? ` href="${safePath}" aria-labelledby="${titleId}"` : '';
            const plannedClass = isLaunchableLesson ? '' : ' module-card--planned';
            const safeTitle = escapeHtml(lesson.title || 'Untitled Lesson');
            const safeDescription = escapeHtml(lesson.description || '');
            const lessonImage = getLessonImage(lesson);
            const imageSrc = escapeHtml(encodeURI(lessonImage.src));
            const imagePosition = escapeHtml(lessonImage.position || 'center');
            const footerContent = isLaunchableLesson
                ? `<span class="launch-cta">Launch Lesson <span class="arrow-icon" aria-hidden="true">&rarr;</span></span>`
                : `<span class="planned-label">Coming Soon</span>`;

            return `<${tag}${hrefAttr} class="module-card ${getThemeClass(lesson.themeKey, index)}${plannedClass}" style="--i: ${index}; --image-position: ${imagePosition};">
                <div class="card-art">
                    <img src="${imageSrc}" alt="" loading="lazy">
                </div>
                <div class="card-body">
                    <span class="card-num" aria-hidden="true">${index + 1}</span>
                    <h3 class="module-name" id="${titleId}">${safeTitle}</h3>
                    <p class="module-desc">${safeDescription}</p>
                    ${buildChips(lesson)}
                </div>
                <div class="card-footer">${footerContent}</div>
            </${tag}>`;
        }

        function visibleLessons(lessons) {
            return (Array.isArray(lessons) ? lessons : []).filter(function (lesson) {
                return lesson && lesson.status !== 'blocked';
            });
        }

        function renderDashboard() {
            const lessons = visibleLessons(allLessons);
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = lessons.length
                ? lessons.map((lesson, i) => buildCard(lesson, i)).join('')
                : '<div class="empty-state">No lessons found &mdash; the lesson registry may be empty or unreadable.</div>';
        }

        function initDashboard(data) {
            allLessons = Array.isArray(data.lessons) ? data.lessons : FALLBACK_LESSONS;
            renderDashboard();
        }

        document.addEventListener('DOMContentLoaded', function () {
            fetch('lesson-registry.json', { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    initDashboard(data);
                })
                .catch(function (error) {
                    // Be honest about the failure: label the page as the
                    // offline copy and leave maintainers a breadcrumb
                    console.warn('Lesson registry unavailable — showing the built-in offline copy (synced ' + FALLBACK_SYNCED + ').', error);
                    const offlineNote = document.getElementById('offlineNote');
                    if (offlineNote) offlineNote.hidden = false;
                    initDashboard({ lessons: FALLBACK_LESSONS });
                });
        });
    </script>
</body>
</html>
